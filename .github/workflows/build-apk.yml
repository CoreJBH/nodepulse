name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Build nodepulse.apk
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build single-file web app
        run: |
          python3 build.py
          ls -l dist/nodepulse.html

      - name: Stage web app into APK assets
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          cp dist/nodepulse.html android/app/src/main/assets/index.html
          ls -l android/app/src/main/assets/index.html
          grep -c 'data:image/png;base64' android/app/src/main/assets/index.html

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" nodepulse.apk
          ls -l nodepulse.apk
          sha256sum nodepulse.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodepulse-apk
          path: nodepulse.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nodepulse.apk
          generate_release_notes: true
