# The Gradle this project builds with.
#
# There is no gradlew and no gradle-wrapper.jar in the tree on purpose: CI
# installs the version named in .github/workflows/build-apk.yml, and F-Droid
# deletes a repository's wrapper and runs its own (gradlew-fdroid), which reads
# the version from this file. 8.7 is the oldest Gradle the Android Gradle Plugin
# 8.5.2 accepts, so it is the one pinned here.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
